[agents]
# Settings shared by all agents
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
settings_address = "tcp://localhost:9092"
timecode_fps = 25
# Outgoing payload encoding, fleet-wide default (can be overridden per agent).
#   wire_format: "json" (default) or "msgpack"
#   compression: "auto" (default, compress only frames >= 256 B), "snappy"
#                (always) or "none"
wire_format = "msgpack"
compression = "auto"


#  __  __                   _ _ _   _     _      
# |  \/  | ___  _ __   ___ | (_) |_| |__ (_) ___ 
# | |\/| |/ _ \| '_ \ / _ \| | | __| '_ \| |/ __|
# | |  | | (_) | | | | (_) | | | |_| | | | | (__ 
# |_|  |_|\___/|_| |_|\___/|_|_|\__|_| |_|_|\___|
#                                                

[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"
prefer_loopback_for_local_services = true
# The followings are only needed if using CURVE encryption
# auth_verbose = false
# ip_whitelist = ["127.0.0.1"] # default is empty (allow all)

[logger]
mongo_uri = "mongodb://localhost:27017"
mongo_db = "blescan2"
# sub_topic = ["logger", "metadata", "rfid", "skeleton", "platform", "image", "agent_event", "bridge", "perf_assess"]
# or, subscribe to all topics:
sub_topic = ["blescan", "blefilter"]
initially_paused = false


#  ____  _             _
# |  _ \| |_   _  __ _(_)_ __  ___ 
# | |_) | | | | |/ _` | | '_ \/ __|
# |  __/| | |_| | (_| | | | | \__ \
# |_|   |_|\__,_|\__, |_|_| |_|___/
#                |___/             
#


[blescan]
pub_topic = "blescan"
adapter = 0
max_age_ms = 30000
filter_empty_manufacturer = true
only_when_changed = true
period = 10
adapter_refresh = 600

[blefilter]
sub_topic = ["blescan"]
rssi_min = -50
silent = false
layout_ary = false
layout_map = true
# id_whitelist = ["004c"] # list of device addresses to include, empty = all
# id_blacklist = ["0006", "004c"]

[feedback]
# Subscribes to ALL topics
sub_topic = ["blefilter"]
print_width = 0
indent_width = 2

[rerunner]
sub_topic = ["blefilter"]
keypaths = ["blefilter/rssi_map", "blefilter/num_devices", "blefilter/num_filtered_devices"]
parallelize = false
